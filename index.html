<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Exactly: a design challenge generator. Deal a category, a brand name and a colour palette, then design it.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1.5' y='1.5' width='29' height='29' fill='white' stroke='%23222' stroke-width='3'/%3E%3Ctext x='16' y='22.5' font-family='Arial,Helvetica,sans-serif' font-weight='700' font-size='17' text-anchor='middle' fill='%23222'%3EE%3C/text%3E%3C/svg%3E">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<title>Exactly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap">
<style>
/* Layout: thin top bar; left = feed-style heading and Deal over three square blocks; right = sidebar
   (challenge sentence, Copy, tabs with a fixed-height list). Neutral only: white, greys, near-black.
   The palette swatches are the only colour on the page, because they are the challenge. Deliberately one light look. */
:root{
  color-scheme: light;
  --bg:#ffffff;
  --ink:#222222;
  --text:#333333;
  --mid:#6f6f6f;
  --soft:#b3b3b3;
  --line:#dddddd;
  --hair:#ececec;
  --row:#f5f5f5;
  --btn:#efefef;
  --sans:"Arimo","Helvetica Neue",Helvetica,Arial,sans-serif;
}
html,body{background:var(--bg);color:var(--text)}
body{font-family:var(--sans);font-size:15px;line-height:1.4;margin:0}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{border-bottom:1px solid var(--hair)}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;height:54px}
.brand{font-weight:700;font-size:17px;color:var(--ink);letter-spacing:-.01em}
.top a{color:var(--mid);text-decoration:none;font-size:14px}
.top a:hover{color:var(--ink)}

/* page grid */
.page{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:clamp(24px,4vw,56px);padding-block:44px 64px}

/* feed column */
.feed-head{text-align:center;display:grid;gap:8px;margin-bottom:40px}
.feed-head h1{margin:0;font-weight:400;font-size:clamp(24px,2.6vw,34px);line-height:1.15;color:var(--mid);letter-spacing:-.01em}
.feed-head h1 b{color:var(--ink);font-weight:700}
.feed-head p{margin:0;color:var(--mid);font-size:14px;min-height:1.4em}
.blocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,1.8vw,24px)}
.col{display:grid;gap:10px;min-width:0}
.block{
  aspect-ratio:1/1;border:2px solid var(--line);background:var(--bg);
  display:grid;place-items:center;text-align:center;padding:8%;min-width:0;container-type:inline-size;
  transition:border-color .15s;
}
.block.empty{cursor:pointer}
.block.empty:hover{border-color:#c4c4c4}
.block.held{border-color:var(--ink)}
.inner{display:grid;gap:4px;justify-items:center;min-width:0;width:100%;transition:opacity .16s}
.inner.swap{opacity:0}
.b-title{margin:0 0 6px;font-weight:400;font-size:clamp(20px,8.4cqw,34px);line-height:1.15;color:var(--ink);overflow-wrap:break-word;text-wrap:balance;max-width:100%}
.empty .b-title{color:var(--soft)}
.b-by{margin:0;font-weight:700;font-size:clamp(13px,4.2cqw,16px);color:var(--text)}
.b-meta{margin:0;font-size:clamp(13px,4.2cqw,16px);color:var(--text)}
.empty .b-by,.empty .b-meta{color:var(--soft)}
.sw{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,4cqw,16px);width:100%;margin:4px 0 12px}
.sw button{all:unset;box-sizing:border-box;cursor:copy;display:grid;gap:5px;justify-items:center;min-width:0}
.sw i{display:block;width:100%;aspect-ratio:1/1;border:1px solid rgba(0,0,0,.08)}
.sw span{font-size:clamp(9px,3cqw,11.5px);color:var(--mid);font-variant-numeric:tabular-nums;white-space:nowrap}
.sw button:hover span{color:var(--ink);text-decoration:underline}
.sw button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sw button.copied span{color:var(--ink);font-weight:700}
.col-actions{display:flex;justify-content:center;gap:18px}
.link{all:unset;cursor:pointer;font-size:14px;color:var(--mid)}
.link:hover{color:var(--ink);text-decoration:underline}
.link:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.link[aria-pressed="true"]{color:var(--ink);font-weight:700}

/* sidebar */
.side{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:22px}
.s-head{display:grid;gap:14px;justify-items:start}
.s-head .btn{font-size:15px;padding:9px 14px}
.s-title{margin:0;font-weight:400;font-size:24px;line-height:1.25;color:var(--ink);min-height:3.75em;text-wrap:balance}
.s-title.none{color:var(--soft)}
.kv{margin:0;display:grid}
.kv div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--hair);font-size:15px}
.kv dt{color:var(--mid)}
.kv dd{margin:0;text-align:right;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv dd b{color:var(--ink)}
.actions{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:14px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--btn);color:var(--ink);font-weight:700;font-size:16px;padding:10px 16px;border-radius:4px;display:inline-flex;gap:8px;align-items:center}
.btn:hover{background:#e4e4e4}
.btn:active{background:#d9d9d9}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:progress}
.btn-plain{all:unset;cursor:pointer;font-size:15px;color:var(--mid);padding:10px 4px}
.btn-plain:hover{color:var(--ink)}
.btn-plain:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.feed-head .hint{font-size:13px;color:var(--soft);min-height:0}

.tabs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-bottom:1px solid var(--hair)}
.tab{all:unset;cursor:pointer;text-align:center;padding:12px 0;font-size:16px;color:var(--mid);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.count{display:inline-block;margin-left:6px;padding:2px 7px;background:var(--row);border-radius:3px;font-size:13px;color:var(--mid);font-variant-numeric:tabular-nums}
.tabpanel{height:340px;overflow-y:auto;padding-top:20px;overscroll-behavior:contain;scrollbar-color:#cfcfcf transparent}
.group{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:28px}
.g-head{display:flex;justify-content:space-between;font-size:15px;color:var(--mid);padding-bottom:4px}
.g-head span:first-child{color:var(--text)}
.rowbtn{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--row);padding:14px 16px;border-radius:3px;font-size:16px;color:var(--ink)}
.rowbtn:hover{background:#eeeeee}
.rowbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.rowbtn .l{display:flex;align-items:baseline;gap:8px;min-width:0}
.rowbtn .l span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowbtn small{font-size:13px;color:var(--mid);flex:none;font-variant-numeric:tabular-nums}
.rowbtn .r{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.empty-note{color:var(--soft);font-size:15px;margin:0}
.how{margin:0;padding-left:20px;display:grid;gap:12px;font-size:15px;line-height:1.5;color:var(--text)}
.how b{color:var(--ink)}

/* footer */
.foot{border-top:1px solid var(--hair)}
.foot-in{max-width:1320px;margin:0 auto;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:18px;font-size:13px;color:var(--soft)}
.foot a{color:var(--mid);text-decoration:none}
.foot a:hover{color:var(--ink)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:#fff;font-size:14px;padding:9px 14px;border-radius:4px;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* pick dialog */
dialog{border:1px solid var(--line);border-radius:4px;padding:0;width:min(420px,calc(100vw - 32px));max-height:min(560px,80vh);background:var(--bg);color:var(--text);box-shadow:0 20px 50px -20px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(255,255,255,.75)}
.sheet{display:grid;grid-template-rows:auto auto 1fr;max-height:min(560px,80vh)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px}
.sheet-head h2{margin:0;font-weight:400;font-size:22px;color:var(--ink)}
.close{all:unset;cursor:pointer;color:var(--mid);font-size:20px;padding:2px 6px}
.close:hover{color:var(--ink)}
.close:focus-visible{outline:2px solid var(--ink)}
.search{margin:0 18px 10px;padding:10px 12px;font:15px var(--sans);border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.search:focus{outline:2px solid var(--ink);outline-offset:-1px}
.opts{list-style:none;margin:0;padding:0 10px 12px;overflow-y:auto}
.opts button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;padding:9px 8px;border-radius:3px;cursor:pointer;font-size:15px;color:var(--ink)}
.opts button:hover,.opts button:focus-visible{background:var(--row)}
.mini{display:flex;flex:none}
.mini i{width:10px;height:10px;display:block}

@media (max-width:1000px){
  .page{grid-template-columns:1fr}
  .s-title{min-height:2.5em}
}
@media (max-width:620px){
  .page{padding-block:28px 48px}
  .feed-head{margin-bottom:26px}
  .blocks{grid-template-columns:1fr;gap:20px}
  .block{aspect-ratio:3/2;padding:6%}
  .b-title{font-size:26px}
  .sw{max-width:320px}
  .tabpanel{height:300px}
  .s-title{min-height:5em;font-size:22px}
  .feed-head .hint{display:none}
}
@media (prefers-reduced-motion:reduce){ .inner,.toast,.block{transition:none} }
</style>
</head>
<body>
<header class="top pad">
  <div class="top-in">
    <span class="brand">Exactly</span>
    <a href="https://github.com/aismbx" target="_blank" rel="noopener">aismbx github</a>
  </div>
</header>

<main class="page pad">
  <section aria-label="Cards">
    <div class="feed-head">
      <h1 id="feed-title"></h1>
      <p id="feed-sub"></p>
      <div class="actions">
        <button class="btn" id="go" type="button">Deal <span aria-hidden="true">→</span></button>
      </div>
      <p class="hint">or press Space</p>
    </div>
    <div class="blocks" id="blocks"></div>
  </section>

  <aside class="side" aria-label="Challenge details">
    <div class="s-head">
      <h2 class="s-title" id="s-title" aria-live="polite"></h2>
      <button class="btn" id="copy" type="button">Copy challenge</button>
    </div>
    <div>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="t-recent" aria-selected="true" type="button">Recent rolls<span class="count" id="count">0</span></button>
        <button class="tab" role="tab" id="t-how" aria-selected="false" type="button">How to play</button>
      </div>
      <div class="tabpanel" id="panel" role="tabpanel"></div>
    </div>
  </aside>
</main>

<footer class="foot pad">
  <div class="foot-in"><span>Exactly · design challenge generator</span><a href="https://github.com/aismbx" target="_blank" rel="noopener">github.com/aismbx</a></div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="sheet" aria-labelledby="sheet-title">
  <div class="sheet">
    <div class="sheet-head"><h2 id="sheet-title">Pick</h2><button class="close" id="close" type="button" aria-label="Close">✕</button></div>
    <input class="search" id="search" type="search" placeholder="Search" aria-label="Search this deck">
    <ul class="opts" id="opts"></ul>
  </div>
</dialog>

const DECKS = [
  {key:"cat",   label:"Category",   noun:"category",   items:CATEGORIES, idx:null, held:false, at:null},
  {key:"brand", label:"Brand name", noun:"brand name", items:BRANDS,     idx:null, held:false, at:null},
  {key:"pal",   label:"Palette",    noun:"palette",    items:PALETTES,   idx:null, held:false, at:null}
];
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const art = w => /^[aeiou]/i.test(w) ? "an" : "a";
const MASS = new Set(["Burnt Toast","Sea Glass","Glass Gem Corn","Close-Up Teeth","Easter Egg Foil","Pickled Beetroot","Retro Kitchen Lino","Mint Toothpaste","Seaside Rock Candy","Airport Carpet","Arcade Carpet","Cream Soda","Swimming Pool Tile","Motel Signage","Cough Syrup"]);
const fromPhrase = n => (/'s\b/.test(n) || /[^s]s$/.test(n) || MASS.has(n)) ? n.toLowerCase() : `${art(n)} ${n.toLowerCase()}`;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait = ms => new Promise(r=>setTimeout(r,ms));
let busy = false, rolls = 0, history = [], tab = "recent", lastDeal = null, lastCount = 0;
try { history = JSON.parse(localStorage.getItem("exactly-neutral-history")||"[]") || []; rolls = history.length ? history[0].roll : 0; } catch(e){ history = []; }

function ago(ts){
  const s = Math.max(0,(Date.now()-ts)/1000), m = s/60, h = m/60, d = h/24;
  if(m < 1) return "less than a minute ago";
  if(m < 1.5) return "1 minute ago";
  if(m < 45) return Math.round(m)+" minutes ago";
  if(h < 1.5) return "about 1 hour ago";
  if(h < 24) return "about "+Math.round(h)+" hours ago";
  if(d < 1.5) return "1 day ago";
  if(d < 30) return Math.round(d)+" days ago";
  if(d < 45) return "about 1 month ago";
  if(d < 365) return Math.round(d/30)+" months ago";
  return "over "+Math.floor(d/365)+" year"+(d>=730?"s":"")+" ago";
}
const name = d => d.key==="pal" ? PALETTES[d.idx].n : d.items[d.idx];
const ready = () => DECKS.every(d=>d.idx!==null);

/* ---------- blocks ---------- */
function blockHTML(d){
  if(d.idx===null){
    return `<p class="b-title">${d.label}</p><p class="b-by">${d.items.length} cards</p><p class="b-meta">not dealt yet</p>`;
  }
  const when = d.held ? "held" : ago(d.at);
  if(d.key==="pal"){
    const p = PALETTES[d.idx];
    return `<p class="b-title">${esc(p.n)}</p>
      <div class="sw">${p.c.map(h=>`<button type="button" data-hex="${h}" aria-label="Copy ${h}" title="Copy ${h}"><i style="background:${h}"></i><span>${h}</span></button>`).join("")}</div>
      <p class="b-by">palette</p><p class="b-meta" data-at>${when}</p>`;
  }
  return `<p class="b-title">${esc(name(d))}</p><p class="b-by">${d.noun}</p><p class="b-meta">${d.items.length} cards</p><p class="b-meta" data-at>${when}</p>`;
}
function build(){
  DECKS.forEach(d=>{
    const col = document.createElement("div");
    col.className = "col";
    col.innerHTML = `<div class="block"><div class="inner"></div></div>
      <div class="col-actions"><button class="link hold" type="button" aria-pressed="false">Hold</button><button class="link pick" type="button">Pick</button></div>`;
    $("blocks").appendChild(col);
    d.block = col.querySelector(".block"); d.inner = col.querySelector(".inner"); d.holdBtn = col.querySelector(".hold");
    d.holdBtn.addEventListener("click",()=>{ if(d.idx===null){ toast("Deal first, then hold a card."); return; } d.held=!d.held; paint(d); renderSide(); });
    col.querySelector(".pick").addEventListener("click",()=>openSheet(d));
    d.block.addEventListener("click",e=>{
      const b = e.target.closest("[data-hex]");
      if(b){ copyHex(b); return; }
      if(d.idx===null && !busy) deal();
    });
    paint(d);
  });
}
function paint(d){
  d.inner.innerHTML = blockHTML(d);
  d.block.classList.toggle("empty", d.idx===null);
  d.block.classList.toggle("held", d.held);
  d.holdBtn.setAttribute("aria-pressed", d.held);
  d.holdBtn.textContent = d.held ? "Held" : "Hold";
}
async function swapTo(d,next,delay){
  await wait(delay);
  if(!reduced){ d.inner.classList.add("swap"); await wait(160); }
  d.idx = next; d.at = Date.now(); paint(d);
  d.inner.classList.remove("swap");
}

/* ---------- feed heading + sidebar ---------- */
function renderFeed(){
  if(!rolls && !ready()){
    $("feed-title").innerHTML = `<b>Exactly</b> has 3 decks`;
    $("feed-sub").textContent = "Press Deal to start";
    return;
  }
  if(!ready()){
    $("feed-title").innerHTML = `<b>Pick</b> or <b>Deal</b> the rest`;
    $("feed-sub").textContent = "";
    return;
  }
  $("feed-title").innerHTML = `<b>Roll ${String(rolls).padStart(2,"0")}</b> dealt ${lastCount} card${lastCount===1?"":"s"}`;
  $("feed-sub").textContent = lastDeal ? ago(lastDeal) : "";
}
function renderSide(){
  const t = $("s-title");
  if(ready()){
    const c = name(DECKS[0]), b = name(DECKS[1]), p = name(DECKS[2]);
    t.classList.remove("none");
    t.textContent = `Design ${art(c)} ${c.toLowerCase()} brand called “${b}”, using only colours from ${fromPhrase(p)}.`;
  } else {
    t.classList.add("none");
    t.textContent = "No challenge yet";
  }
  $("count").textContent = history.length;
}
function renderPanel(){
  $("t-recent").setAttribute("aria-selected", tab==="recent");
  $("t-how").setAttribute("aria-selected", tab==="how");
  const panel = $("panel");
  if(tab==="how"){
    panel.innerHTML = `<ol class="how">
      <li>Press <b>Deal</b> (or Space) to get a category, a brand name and a palette.</li>
      <li>Design that kind of brand, with that name, using <b>only</b> those five colours.</li>
      <li>Click a colour to copy its code.</li>
      <li><b>Hold</b> a card to keep it while the others change.</li>
      <li><b>Pick</b> to choose a card yourself.</li>
      <li>Click a recent roll to bring it back.</li></ol>`;
    return;
  }
  if(!history.length){ panel.innerHTML = `<p class="empty-note">Nothing dealt yet. Your challenges will show up here.</p>`; return; }
  const fmt = new Intl.DateTimeFormat("en-GB",{month:"long",year:"numeric"});
  const groups = [];
  history.forEach(h=>{
    const label = fmt.format(new Date(h.t||Date.now()));
    let g = groups[groups.length-1];
    if(!g || g.label!==label){ g = {label,items:[]}; groups.push(g); }
    g.items.push(h);
  });
  panel.innerHTML = "";
  groups.forEach((g,gi)=>{
    const wrap = document.createElement("div"); wrap.className = "group";
    wrap.innerHTML = `<div class="g-head"><span>${gi===0?"All rolls":""}</span><span>${g.label}</span></div>`;
    g.items.forEach(h=>{
      const b = document.createElement("button"); b.type="button"; b.className="rowbtn";
      b.innerHTML = `<span class="l"><span>${esc(h.c)} / ${esc(h.b)}</span><small>${String(h.roll).padStart(2,"0")}</small></span><span class="r">${esc(h.p)}</span>`;
      b.title = `Bring back roll ${h.roll}`;
      b.addEventListener("click",()=>restore(h));
      wrap.appendChild(b);
    });
    panel.appendChild(wrap);
  });
}
function renderAll(){ renderFeed(); renderSide(); renderPanel(); }

function record(count){
  if(!ready()){ renderAll(); return; }
  rolls++; lastDeal = Date.now(); lastCount = count;
  history.unshift({roll:rolls, c:name(DECKS[0]), b:name(DECKS[1]), p:name(DECKS[2]), t:lastDeal});
  history = history.slice(0,40);
  try{ localStorage.setItem("exactly-neutral-history",JSON.stringify(history)); }catch(e){}
  renderAll();
}

/* ---------- actions ---------- */
async function deal(){
  if(busy) return;
  const targets = DECKS.filter(d=>!(d.held && d.idx!==null));
  if(!targets.length){ toast("All three cards are held. Release one to deal again."); return; }
  busy = true; $("go").disabled = true;
  await Promise.all(targets.map((d,i)=>{
    let next; do{ next = Math.floor(Math.random()*d.items.length); }while(next===d.idx && d.items.length>1);
    return swapTo(d,next,i*90);
  }));
  record(targets.length);
  busy = false; $("go").disabled = false;
}
async function restore(h){
  if(busy) return;
  const idxs = [CATEGORIES.indexOf(h.c), BRANDS.indexOf(h.b), PALETTES.findIndex(x=>x.n===h.p)];
  if(idxs.some(i=>i<0)) return;
  busy = true;
  await Promise.all(DECKS.map((d,i)=> d.idx===idxs[i] ? null : swapTo(d,idxs[i],i*90)));
  rolls = h.roll; lastDeal = h.t; lastCount = 3;
  renderAll(); busy = false;
  toast(`Roll ${String(h.roll).padStart(2,"0")} is back`);
}

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove("on"),1800);
}
function copyText(text,onDone){
  const fallback = ()=>{
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly","");
    Object.assign(ta.style,{position:"fixed",top:"0",left:"0",width:"1px",height:"1px",padding:"0",border:"0",opacity:"0",pointerEvents:"none"});
    const keep = document.activeElement, x = scrollX, y = scrollY;
    document.body.appendChild(ta); ta.focus({preventScroll:true}); ta.select();
    let ok=false; try{ ok=document.execCommand("copy"); }catch(e){} ta.remove();
    if(keep && keep.focus) keep.focus({preventScroll:true}); scrollTo(x,y);
    onDone(ok);
  };
  try{ navigator.clipboard.writeText(text).then(()=>onDone(true),fallback); }catch(e){ fallback(); }
}
function copyHex(btn){
  const hex = btn.dataset.hex, label = btn.querySelector("span");
  copyText(hex, ok=>{
    toast(ok ? `${hex} copied` : `Couldn't reach the clipboard. The code is ${hex}.`);
    if(!ok) return;
    label.textContent = "Copied"; btn.classList.add("copied");
    clearTimeout(btn._t); btn._t = setTimeout(()=>{ label.textContent = hex; btn.classList.remove("copied"); },1100);
  });
}
$("copy").addEventListener("click",()=>{
  if(!ready()){ toast("Deal first, then copy your challenge."); return; }
  copyText($("s-title").textContent + "\nPalette: " + PALETTES[DECKS[2].idx].c.join(", "), ok=>toast(ok ? "Challenge copied" : "Couldn't reach the clipboard. Copy the sentence by hand."));
});

/* ---------- pick ---------- */
let sheetDeck = null;
function openSheet(d){
  if(busy) return;
  sheetDeck = d;
  $("sheet-title").textContent = "Pick a " + d.noun;
  $("search").value = ""; fillOpts("");
  $("sheet").showModal(); $("search").focus();
}
function fillOpts(q){
  const d = sheetDeck, ul = $("opts"); ul.innerHTML = "";
  d.items.forEach((it,i)=>{
    const nm = d.key==="pal" ? it.n : it;
    if(q && !nm.toLowerCase().includes(q.toLowerCase())) return;
    const li = document.createElement("li"), b = document.createElement("button");
    b.type = "button";
    b.innerHTML = (d.key==="pal" ? `<span class="mini">${it.c.map(h=>`<i style="background:${h}"></i>`).join("")}</span>` : "") + esc(nm);
    b.addEventListener("click", async ()=>{
      $("sheet").close();
      if(i===d.idx) return;
      busy = true; $("go").disabled = true;
      await swapTo(d,i,0); record(1);
      busy = false; $("go").disabled = false;
    });
    li.appendChild(b); ul.appendChild(li);
  });
}
$("search").addEventListener("input",e=>fillOpts(e.target.value));
$("close").addEventListener("click",()=>$("sheet").close());
$("sheet").addEventListener("click",e=>{ if(e.target===$("sheet")) $("sheet").close(); });

/* ---------- wiring ---------- */
$("go").addEventListener("click",deal);
$("t-recent").addEventListener("click",()=>{ tab="recent"; renderPanel(); });
$("t-how").addEventListener("click",()=>{ tab="how"; renderPanel(); });
document.addEventListener("keydown",e=>{
  if(e.code==="Space" && !$("sheet").open && !["INPUT","BUTTON","TEXTAREA"].includes(document.activeElement.tagName)){ e.preventDefault(); deal(); }
});
setInterval(()=>{
  DECKS.forEach(d=>{ const el = d.inner.querySelector("[data-at]"); if(el && d.idx!==null && !d.held) el.textContent = ago(d.at); });
  if(lastDeal){ $("feed-sub").textContent = ago(lastDeal); const dd = document.querySelector("[data-dealt]"); if(dd) dd.textContent = ago(lastDeal); }
},30000);

build(); renderAll();
</script>
</body>
